name: Mercurialis 2016 prior-art Dryad original data verification
on:
  push:
    paths:
      - '.github/workflows/mercurialis-2016-dryad-priorart-access-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe official Dryad metadata and data files without publishing individual records
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,urllib.error,json,hashlib,io,csv,os
          base="https://datadryad.org"
          doi="doi:10.5061/dryad.55186"
          encoded=urllib.parse.quote(doi,safe="")
          urls=[
            base+"/api/v2/datasets/"+encoded,
            base+"/api/v2/datasets/"+encoded+"/versions",
            base+"/api/v2/datasets/"+encoded+"/download",
            base+"/api/v2/files/45101/download",
            base+"/api/v2/files/45103/download",
            base+"/downloads/file_stream/45101",
            base+"/downloads/file_stream/45103",
          ]
          report={"source":{"article_doi":"10.1111/1365-2745.12659","dryad_doi":"10.5061/dryad.55186","doi_publication_year":2016,"data_published":"2017-08-16"},"probes":[]}
          for url in urls:
              item={"url":url}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"SLK-primary-source-audit/1.0 (academic reproducibility)","Accept":"*/*"})
                  with urllib.request.urlopen(req,timeout=24) as resp:
                      raw=resp.read(450000)
                      item.update({"status":resp.status,"type":resp.headers.get("Content-Type"),"length_read":len(raw),"sha256_of_bytes_read":hashlib.sha256(raw).hexdigest()})
                  ct=item["type"] or ""
                  if "json" in ct or raw.lstrip()[:1] in (b"{",b"["):
                      try:
                          obj=json.loads(raw)
                          item["json_metadata"]=str(obj)[:5500]
                      except Exception as e:item["parse_error"]=str(e)[:120]
                  elif raw[:2] in (b"PK",):item["zip_header"]=True
                  elif b"MotherID" in raw[:1000] or b"seedID" in raw[:1000]:
                      item["text_preview_lines"]=raw[:1500].decode("utf-8-sig",errors="replace").splitlines()[:5]
                  else:
                      item["prefix"]=raw[:140].decode("utf-8",errors="replace")
              except Exception as exc:item["error"]=type(exc).__name__+": "+str(exc)[:220]
              report["probes"].append(item)
          with open("slk_2016_dryad_access_v1.json","w") as out:json.dump(report,out,indent=2,ensure_ascii=False)
          print("SLK_DRYAD_SOURCE_AUDIT_START")
          print(json.dumps(report,indent=2,ensure_ascii=False)[:24000])
          print("SLK_DRYAD_SOURCE_AUDIT_END")
          PY
      - name: Publish access receipt, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mercurialis-2016-dryad-access-v1
          path: slk_2016_dryad_access_v1.json
          if-no-files-found: warn
