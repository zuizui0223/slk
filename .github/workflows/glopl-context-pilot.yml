name: GloPL within-species ecological-context pilot

on:
  workflow_dispatch:
  push:
    branches:
      - biology/scaffold-bypass-test-20261014
    paths:
      - scripts/analyze_glopl_context_variation.py
      - tests/test_glopl_context_variation.py
      - .github/workflows/glopl-context-pilot.yml

permissions:
  contents: read

jobs:
  global-macro-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate parsers and ecological scope with synthetic cases
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_glopl_context_variation.py
      - name: Retrieve pinned public GloPL CSV and verify locked original analysis
        run: |
          python scripts/analyze_glopl_context_variation.py \
            --download \
            --assert-pilot \
            --out "$RUNNER_TEMP/SLK_GLOPL_CONTEXT_RECEIPT.json" \
            --groups "$RUNNER_TEMP/SLK_GLOPL_MATCHED_GROUPS.csv"
      - name: Display compact empirical receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"SLK_GLOPL_CONTEXT_RECEIPT.json"
          x=json.loads(p.read_text())
          print(json.dumps({
            "upstream_blob_sha": x["upstream_blob_sha"],
            "total_experiments": x["raw_experiment_rows"],
            "filtered_records": x["filtered_original_rows"],
            "matched": x["primary"],
            "same_site_different_years": x["same_site_different_years"],
            "same_year_different_sites": x["same_year_different_sites"],
            "species_cluster_bootstrap": x["species_cluster_bootstrap"],
          },indent=2))
          PY
      - name: Upload derived receipts only (no upstream raw CSV redistributed)
        uses: actions/upload-artifact@v4
        with:
          name: slk-glopl-context-audit
          path: |
            ${{ runner.temp }}/SLK_GLOPL_CONTEXT_RECEIPT.json
            ${{ runner.temp }}/SLK_GLOPL_MATCHED_GROUPS.csv
          if-no-files-found: error
