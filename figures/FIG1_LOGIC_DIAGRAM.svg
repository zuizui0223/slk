<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title { font: 700 32px Arial, Helvetica, sans-serif; fill: #111; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #333; }
      .box { fill:#fff; stroke:#222; stroke-width:2.2; rx:16; }
      .surface { fill:#fafafa; stroke:#555; stroke-width:1.8; rx:12; }
      .family { fill:#fff; stroke:#777; stroke-width:1.7; rx:14; }
      .boxlabel { font:700 22px Arial, Helvetica, sans-serif; fill:#111; }
      .small { font:400 16px Arial, Helvetica, sans-serif; fill:#222; }
      .tiny { font:400 14px Arial, Helvetica, sans-serif; fill:#333; }
      .note { font:600 15px Arial, Helvetica, sans-serif; fill:#222; }
      .surfacehead { font:700 17px Arial, Helvetica, sans-serif; fill:#111; }
      .arrow { stroke:#333; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#666; stroke-width:2; stroke-dasharray:8 6; fill:none; }
      .align { stroke:#444; stroke-width:2.2; stroke-dasharray:5 5; fill:none; }
    </style>
  </defs>

  <text x="700" y="46" text-anchor="middle" class="title">One architecture comparison crosses different evolutionary thresholds</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">New mechanisms split critical surfaces; the registered population process forces an exact re-alignment</text>

  <text x="1160" y="112" text-anchor="middle" class="surfacehead">Exact critical surface</text>

  <!-- central transport -->
  <rect x="410" y="112" width="520" height="82" class="box"/>
  <text x="670" y="145" text-anchor="middle" class="boxlabel">Identified conflict budget L</text>
  <text x="670" y="171" text-anchor="middle" class="small">shared-coordinate compromise; entry gate is L &gt; 0</text>

  <path d="M670 194 L670 226" class="arrow"/>

  <rect x="410" y="228" width="520" height="98" class="box"/>
  <text x="670" y="260" text-anchor="middle" class="boxlabel">Global architecture value Φ = R − K</text>
  <text x="670" y="286" text-anchor="middle" class="small">does recovered conflict outweigh architecture debit?</text>
  <text x="670" y="309" text-anchor="middle" class="tiny">quadratic bridge only: R = sL</text>

  <path d="M670 326 L670 352" class="arrow"/>

  <rect x="410" y="354" width="520" height="82" class="box"/>
  <text x="670" y="387" text-anchor="middle" class="boxlabel">Small-step selective accessibility</text>
  <text x="670" y="413" text-anchor="middle" class="small">are sufficiently small release steps selectively uphill?</text>

  <path d="M670 436 L670 468" class="arrow"/>

  <rect x="410" y="470" width="520" height="92" class="box"/>
  <text x="670" y="503" text-anchor="middle" class="boxlabel">Frequency-dependent invasion</text>
  <text x="670" y="529" text-anchor="middle" class="small">can D enter S, and can D resist reverse invasion?</text>

  <path d="M670 562 L670 594" class="arrow"/>

  <rect x="410" y="596" width="520" height="98" class="box"/>
  <text x="670" y="629" text-anchor="middle" class="boxlabel">Finite-population fixation</text>
  <text x="670" y="655" text-anchor="middle" class="small">reciprocal ordering and advantage over neutrality are distinct</text>
  <text x="670" y="678" text-anchor="middle" class="tiny">registered self-excluding exponential Moran process</text>

  <path d="M670 694 L670 726" class="arrow"/>

  <rect x="410" y="728" width="520" height="82" class="box"/>
  <text x="670" y="761" text-anchor="middle" class="boxlabel">Weak-mutation monomorphic occupancy</text>
  <text x="670" y="787" text-anchor="middle" class="small">long-run state weight under symmetric rare mutation</text>

  <!-- exact critical surfaces -->
  <rect x="985" y="237" width="330" height="72" class="surface"/>
  <text x="1150" y="266" text-anchor="middle" class="note">endpoint value</text>
  <text x="1150" y="291" text-anchor="middle" class="surfacehead">Φ = 0  ⇔  k = k_global</text>
  <path d="M930 277 L985 277" class="dash"/>

  <rect x="985" y="360" width="330" height="68" class="surface"/>
  <text x="1150" y="388" text-anchor="middle" class="note">small-step release</text>
  <text x="1150" y="413" text-anchor="middle" class="surfacehead">k = k_local</text>
  <path d="M930 395 L985 395" class="dash"/>

  <rect x="985" y="478" width="330" height="78" class="surface"/>
  <text x="1150" y="505" text-anchor="middle" class="note">rare-invasion boundaries</text>
  <text x="1150" y="530" text-anchor="middle" class="surfacehead">Φ = η   and   Φ = −η</text>
  <path d="M930 516 L985 516" class="dash"/>

  <rect x="985" y="602" width="330" height="86" class="surface"/>
  <text x="1150" y="628" text-anchor="middle" class="note">fixation boundaries</text>
  <text x="1150" y="653" text-anchor="middle" class="surfacehead">reciprocal: Φ = 0</text>
  <text x="1150" y="676" text-anchor="middle" class="tiny">absolute vs neutrality: 3Φ = η [weak selection]</text>
  <path d="M930 645 L985 645" class="dash"/>

  <rect x="985" y="735" width="330" height="68" class="surface"/>
  <text x="1150" y="763" text-anchor="middle" class="note">symmetric rare-mutation occupancy</text>
  <text x="1150" y="788" text-anchor="middle" class="surfacehead">Φ = 0</text>
  <path d="M930 769 L985 769" class="dash"/>

  <!-- re-alignment bracket -->
  <path d="M1328 273 L1352 273 L1352 645 L1328 645" class="align"/>
  <path d="M1352 645 L1352 769 L1328 769" class="align"/>
  <text x="1380" y="535" text-anchor="middle" class="tiny" transform="rotate(90 1380 535)">same Φ = 0 surface: value ⇔ reciprocal fixation ⇔ occupancy</text>

  <!-- one-family constructive system -->
  <rect x="48" y="250" width="305" height="500" class="family"/>
  <text x="200" y="282" text-anchor="middle" class="surfacehead">One constructive family</text>
  <text x="200" y="314" text-anchor="middle" class="small">R(d) = d + d²,  K(d) = kd</text>
  <text x="200" y="339" text-anchor="middle" class="small">d ∈ [0,1]</text>
  <text x="200" y="374" text-anchor="middle" class="note">k_local = 1</text>
  <text x="200" y="399" text-anchor="middle" class="note">k_global = 2</text>
  <text x="200" y="424" text-anchor="middle" class="note">Φ = 2 − k</text>

  <line x1="82" y1="446" x2="318" y2="446" class="dash"/>
  <text x="200" y="476" text-anchor="middle" class="note">Vary only k and η to obtain:</text>
  <text x="75" y="509" class="tiny">• conflict without positive value</text>
  <text x="75" y="540" class="tiny">• positive value without small-step access</text>
  <text x="75" y="571" class="tiny">• access + value without rare invasion</text>
  <text x="75" y="602" class="tiny">• rare invasion without reciprocal fixation</text>
  <text x="75" y="633" class="tiny">• absolute fixation advantage without occupancy</text>
  <text x="200" y="685" text-anchor="middle" class="small">All five non-implications therefore live</text>
  <text x="200" y="710" text-anchor="middle" class="small">inside one architecture-recovery family.</text>

  <path d="M353 505 C380 505 385 505 410 505" class="dash"/>

  <text x="700" y="872" text-anchor="middle" class="subtitle">The arrows are estimand handoffs, not logical implications.</text>
  <text x="700" y="905" text-anchor="middle" class="subtitle">SLK asks where the verdict on differentiation must be re-tested as architecture, interaction, demography, and mutation enter.</text>
  <text x="700" y="938" text-anchor="middle" class="tiny">Critical surfaces are conditional on the declared path-cost, canonical-game, Moran-process, and rare-mutation assumptions.</text>
</svg>
