<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .title { font:700 32px Arial,Helvetica,sans-serif; fill:#111; }
      .subtitle { font:400 18px Arial,Helvetica,sans-serif; fill:#333; }
      .head { font:700 23px Arial,Helvetica,sans-serif; fill:#111; }
      .mid { font:600 18px Arial,Helvetica,sans-serif; fill:#222; }
      .body { font:400 16px Arial,Helvetica,sans-serif; fill:#222; }
      .tiny { font:400 14px Arial,Helvetica,sans-serif; fill:#333; }
      .box { fill:#fff; stroke:#222; stroke-width:2.2; rx:16; }
      .state { fill:#fafafa; stroke:#222; stroke-width:2.2; rx:18; }
      .outcome { fill:#fff; stroke:#111; stroke-width:3; rx:18; }
      .arrow { stroke:#333; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .line { stroke:#555; stroke-width:2.2; fill:none; }
      .dash { stroke:#666; stroke-width:2; stroke-dasharray:8 6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="700" y="48" text-anchor="middle" class="title">One persistent phenotype can hide different evolutionary bottlenecks</text>
  <text x="700" y="79" text-anchor="middle" class="subtitle">Morphology can stay unchanged while the process preventing structural reorganization changes</text>

  <rect x="390" y="112" width="620" height="92" class="box"/>
  <text x="700" y="147" text-anchor="middle" class="head">Documented functional conflict</text>
  <text x="700" y="177" text-anchor="middle" class="body">one integrated structure faces opposing functional optima; L &gt; 0</text>

  <path d="M700 204 L700 245" class="arrow"/>
  <path d="M700 245 C515 245 335 262 240 300" class="line"/>
  <path d="M700 245 L700 300" class="line"/>
  <path d="M700 245 C885 245 1065 262 1160 300" class="line"/>

  <rect x="55" y="302" width="370" height="250" class="state"/>
  <text x="240" y="340" text-anchor="middle" class="head">Architecture bottleneck</text>
  <text x="240" y="374" text-anchor="middle" class="mid">Phi &lt; 0</text>
  <text x="240" y="411" text-anchor="middle" class="body">division of labor releases too little conflict</text>
  <text x="240" y="439" text-anchor="middle" class="body">or costs too much to build and maintain</text>
  <text x="240" y="485" text-anchor="middle" class="mid">focal divided alternative does not repay its cost</text>
  <text x="240" y="520" text-anchor="middle" class="tiny">lower architecture cost can release integration</text>

  <rect x="515" y="302" width="370" height="250" class="state"/>
  <text x="700" y="329" text-anchor="middle" class="head">Evolutionary path</text>
  <text x="700" y="355" text-anchor="middle" class="head">bottleneck</text>
  <text x="700" y="386" text-anchor="middle" class="mid">Phi &gt; 0,  g0 &lt; 0</text>
  <text x="700" y="420" text-anchor="middle" class="body">a divided endpoint is fitter, but available</text>
  <text x="700" y="447" text-anchor="middle" class="body">small changes initially move downhill</text>
  <text x="700" y="488" text-anchor="middle" class="mid">integration persists because of the path</text>
  <text x="700" y="520" text-anchor="middle" class="tiny">a new developmental or mutational route can release the trap</text>

  <rect x="975" y="302" width="370" height="250" class="state"/>
  <text x="1160" y="340" text-anchor="middle" class="head">Establishment bottleneck</text>
  <text x="1160" y="374" text-anchor="middle" class="mid">Phi &gt; 0,  g0 &gt; 0,  Delta_R &lt; 0</text>
  <text x="1160" y="411" text-anchor="middle" class="body">division of labor is favorable and reachable,</text>
  <text x="1160" y="439" text-anchor="middle" class="body">but a rare divided type performs poorly</text>
  <text x="1160" y="485" text-anchor="middle" class="mid">integration persists because of ecology</text>
  <text x="1160" y="520" text-anchor="middle" class="tiny">community change can release ecological stabilization</text>

  <path d="M240 552 C240 640 500 660 615 670" class="line"/>
  <path d="M700 552 L700 655" class="line"/>
  <path d="M1160 552 C1160 640 900 660 785 670" class="line"/>

  <rect x="485" y="654" width="430" height="105" class="outcome"/>
  <text x="700" y="694" text-anchor="middle" class="head">Same visible phenotype</text>
  <text x="700" y="729" text-anchor="middle" class="mid">persistent multifunctionality</text>

  <rect x="220" y="798" width="960" height="62" class="box"/>
  <text x="700" y="824" text-anchor="middle" class="mid">Unchanged morphology does not imply an unchanged evolutionary bottleneck or unchanged resistance.</text>
  <text x="700" y="848" text-anchor="middle" class="tiny">Figure 3 asks when environment shifts the bottleneck—and how resistance erodes before morphology changes.</text>
</svg>
