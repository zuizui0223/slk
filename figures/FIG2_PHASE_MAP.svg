<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100">
  <defs>
    <style>
      .title{font:700 36px Arial,Helvetica,sans-serif;fill:#111}
      .subtitle{font:400 18px Arial,Helvetica,sans-serif;fill:#333}
      .paneltitle{font:700 23px Arial,Helvetica,sans-serif;fill:#111}
      .species{font:700 19px Arial,Helvetica,sans-serif;fill:#111}
      .body{font:400 17px Arial,Helvetica,sans-serif;fill:#222}
      .small{font:400 15px Arial,Helvetica,sans-serif;fill:#333}
      .strong{font:700 17px Arial,Helvetica,sans-serif;fill:#111}
      .panel{fill:#fff;stroke:#222;stroke-width:2.2;rx:18}
      .case{fill:#fafafa;stroke:#555;stroke-width:1.6;rx:13}
      .claim{fill:#fff;stroke:#111;stroke-width:3;rx:18}
      .arrow{stroke:#333;stroke-width:2.5;fill:none;marker-end:url(#a)}
      .dash{stroke:#666;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="750" y="48" text-anchor="middle" class="title">Natural systems resolve functional conflict in different ways</text>
  <text x="750" y="79" text-anchor="middle" class="subtitle">Structural division of labor is one resolution among temporal regulation, persistent integration, and partial decoupling</text>

  <!-- Panel A -->
  <rect x="45" y="115" width="450" height="735" class="panel"/>
  <text x="270" y="153" text-anchor="middle" class="paneltitle">A. Same pollen conflict, different solutions</text>

  <rect x="80" y="185" width="380" height="120" class="case"/>
  <text x="270" y="217" text-anchor="middle" class="species">Shared conflict</text>
  <text x="270" y="247" text-anchor="middle" class="body">pollen rewards pollinators</text>
  <text x="270" y="273" text-anchor="middle" class="body">but must remain available for male reproduction</text>

  <path d="M270 305 L270 344" class="arrow"/>

  <rect x="75" y="348" width="390" height="190" class="case"/>
  <text x="270" y="380" text-anchor="middle" class="species">Solanum rostratum</text>
  <text x="270" y="410" text-anchor="middle" class="strong">structural + temporal partitioning</text>
  <text x="270" y="444" text-anchor="middle" class="body">feeding anthers: preferentially handled</text>
  <text x="270" y="470" text-anchor="middle" class="body">pollinating anther: greater pollen export</text>
  <text x="270" y="496" text-anchor="middle" class="body">pollen also released gradually across buzzes</text>
  <text x="270" y="523" text-anchor="middle" class="small">Vallejo-Marín et al. 2009; Vallejo-Marín &amp; Lundgren 2026</text>

  <path d="M270 538 L270 575" class="arrow"/>

  <rect x="75" y="579" width="390" height="190" class="case"/>
  <text x="270" y="611" text-anchor="middle" class="species">Clarkia</text>
  <text x="270" y="641" text-anchor="middle" class="strong">temporal partitioning, not functional DoL</text>
  <text x="270" y="675" text-anchor="middle" class="body">two anther whorls look differentiated</text>
  <text x="270" y="701" text-anchor="middle" class="body">but both participate in pollen export</text>
  <text x="270" y="727" text-anchor="middle" class="body">delayed dehiscence staggers presentation</text>
  <text x="270" y="754" text-anchor="middle" class="small">Kay et al. 2020</text>

  <text x="270" y="812" text-anchor="middle" class="strong">Morphological differentiation ≠ one universal function</text>

  <!-- Panel B -->
  <rect x="525" y="115" width="450" height="735" class="panel"/>
  <text x="750" y="153" text-anchor="middle" class="paneltitle">B. Ecology shifts the resolution</text>

  <rect x="560" y="185" width="380" height="185" class="case"/>
  <text x="750" y="217" text-anchor="middle" class="species">Penstemon + Keckiella</text>
  <text x="750" y="247" text-anchor="middle" class="strong">pollinator identity shifts pollen dosing</text>
  <text x="750" y="281" text-anchor="middle" class="body">bee-adapted species: more gradual release</text>
  <text x="750" y="307" text-anchor="middle" class="body">hummingbird-adapted relatives: more simultaneous</text>
  <text x="750" y="342" text-anchor="middle" class="small">Castellanos et al. 2006</text>

  <path d="M750 370 L750 405" class="arrow"/>

  <rect x="560" y="409" width="380" height="185" class="case"/>
  <text x="750" y="441" text-anchor="middle" class="species">Pedicularis rex</text>
  <text x="750" y="471" text-anchor="middle" class="strong">same integrated architecture, different local conflict</text>
  <text x="750" y="505" text-anchor="middle" class="body">exsertion increases pollen receipt and seed predation</text>
  <text x="750" y="531" text-anchor="middle" class="body">enemy effects vary with geography and density</text>
  <text x="750" y="566" text-anchor="middle" class="small">Xia et al. 2013; Sun et al. 2016</text>

  <path d="M750 594 L750 629" class="arrow"/>

  <rect x="560" y="633" width="380" height="160" class="case"/>
  <text x="750" y="665" text-anchor="middle" class="species">Ipomoea + Primula</text>
  <text x="750" y="695" text-anchor="middle" class="strong">rarity itself changes reproductive success</text>
  <text x="750" y="729" text-anchor="middle" class="body">pollinators/enemies generate frequency dependence</text>
  <text x="750" y="755" text-anchor="middle" class="body">its sign can differ among populations and years</text>
  <text x="750" y="782" text-anchor="middle" class="small">Epperson &amp; Clegg 1987; Toräng et al. 2008</text>

  <text x="750" y="824" text-anchor="middle" class="strong">Ecology changes both selection and establishment</text>

  <!-- Panel C -->
  <rect x="1005" y="115" width="450" height="735" class="panel"/>
  <text x="1230" y="153" text-anchor="middle" class="paneltitle">C. Decoupling is not independence</text>

  <rect x="1040" y="205" width="380" height="135" class="case"/>
  <text x="1230" y="238" text-anchor="middle" class="species">Multifunctional fish skulls</text>
  <text x="1230" y="266" text-anchor="middle" class="body">same skull used for suction + biting</text>
  <text x="1230" y="290" text-anchor="middle" class="body">suction-only kinematics diversify &gt;13.5× faster</text>
  <text x="1230" y="314" text-anchor="middle" class="body">yet head shape evolves faster in biters</text>
  <text x="1230" y="334" text-anchor="middle" class="small">Corn et al. 2021</text>

  <path d="M1230 340 L1230 386" class="arrow"/>

  <rect x="1040" y="390" width="380" height="145" class="case"/>
  <text x="1230" y="424" text-anchor="middle" class="strong">cichlids split capture from processing</text>
  <text x="1230" y="454" text-anchor="middle" class="body">oral + pharyngeal jaws release the trade-off</text>
  <text x="1230" y="480" text-anchor="middle" class="body">novel trait combinations and trophic diversity</text>
  <text x="1230" y="511" text-anchor="middle" class="small">Burress et al. 2020</text>

  <path d="M1230 535 L1230 580" class="arrow"/>

  <rect x="1040" y="584" width="380" height="150" class="case"/>
  <text x="1230" y="618" text-anchor="middle" class="strong">but ecology re-couples evolution</text>
  <text x="1230" y="650" text-anchor="middle" class="body">feeding guilds drive aligned evolutionary</text>
  <text x="1230" y="676" text-anchor="middle" class="body">responses in both jaw systems</text>
  <text x="1230" y="706" text-anchor="middle" class="body">despite structural independence</text>

  <text x="1230" y="812" text-anchor="middle" class="strong">Division of labor can remain ecologically integrated</text>

  <!-- Bottom synthesis -->
  <path d="M270 850 C270 910 570 930 665 930" class="dash"/>
  <path d="M750 850 L750 914" class="dash"/>
  <path d="M1230 850 C1230 910 930 930 835 930" class="dash"/>

  <rect x="355" y="918" width="790" height="126" class="claim"/>
  <text x="750" y="955" text-anchor="middle" class="paneltitle">Functional conflict does not dictate one architecture</text>
  <text x="750" y="988" text-anchor="middle" class="body">Structural partitioning, temporal partitioning, persistent integration, and mixed states all occur in nature.</text>
  <text x="750" y="1017" text-anchor="middle" class="body">Which resolution is favored depends on architecture, evolutionary history, and ecological partners.</text>
</svg>
