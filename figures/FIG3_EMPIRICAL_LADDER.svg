<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
  <defs>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:34px;font-weight:700}.m{font-size:24px}.s{font-size:20px}.xs{font-size:17px}.axis{stroke:#111;stroke-width:3}.grid{stroke:#999;stroke-width:1.5;stroke-dasharray:8 8}.box{fill:#fff;stroke:#111;stroke-width:2}.arrow{stroke:#111;stroke-width:3;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
  </defs>
  <text x="60" y="55" class="t h">Figure 3. When division of labor pays, can be reached, and can establish</text>

  <!-- Main L-Phi panel -->
  <rect x="60" y="110" width="760" height="650" class="box"/>
  <text x="85" y="150" class="t m">A. Does division of labor pay?</text>
  <line x1="160" y1="680" x2="760" y2="680" class="axis"/>
  <line x1="160" y1="680" x2="160" y2="210" class="axis"/>
  <text x="430" y="730" class="t m">conflict load L</text>
  <text x="90" y="470" class="t m" transform="rotate(-90 90 470)">net value of differentiation Φ</text>
  <line x1="160" y1="450" x2="760" y2="450" class="grid"/>
  <text x="170" y="440" class="t xs">Φ = 0 critical surface</text>
  <line x1="160" y1="210" x2="160" y2="680" class="grid"/>
  <text x="170" y="705" class="t xs">L = 0</text>

  <text x="225" y="330" class="t m">Differentiated architecture pays</text>
  <text x="250" y="360" class="t s">Φ &gt; 0: recovered benefit exceeds architecture cost</text>
  <text x="250" y="545" class="t m">Persistent multifunctional compromise</text>
  <text x="235" y="575" class="t s">L &gt; 0, Φ &lt; 0: persistent compromise</text>
  <text x="180" y="235" class="t s">documented conflict supplies L</text>

  <rect x="565" y="270" width="210" height="110" class="box"/>
  <text x="585" y="305" class="t s">Profitability is not realization</text>
  <text x="585" y="338" class="t xs">Φ &gt; 0 does not imply</text>
  <text x="585" y="365" class="t xs">reachability or establishment</text>

  <!-- Insets -->
  <rect x="860" y="110" width="470" height="290" class="box"/>
  <text x="885" y="150" class="t m">B. Can the fitter state be reached?</text>
  <line x1="930" y1="330" x2="1260" y2="330" class="axis"/>
  <line x1="930" y1="330" x2="930" y2="190" class="axis"/>
  <text x="1040" y="370" class="t s">release coordinate d</text>
  <text x="885" y="265" class="t s" transform="rotate(-90 885 265)">net payoff</text>
  <path d="M930 315 C1000 310, 1080 300, 1140 260 S1240 205,1260 195" stroke="#111" stroke-width="3" fill="none"/>
  <line x1="930" y1="300" x2="1260" y2="215" class="grid"/>
  <text x="970" y="205" class="t xs">k_local &lt; k &lt; k_global</text>
  <text x="970" y="235" class="t xs">small release steps downhill; endpoint wins</text>

  <rect x="860" y="435" width="470" height="325" class="box"/>
  <text x="885" y="475" class="t m">C. Can it establish when rare?</text>
  <line x1="930" y1="690" x2="1260" y2="690" class="axis"/>
  <line x1="930" y1="690" x2="930" y2="515" class="axis"/>
  <text x="1040" y="735" class="t s">net value of differentiation Φ</text>
  <text x="885" y="620" class="t s" transform="rotate(-90 885 620)">rare establishment</text>
  <line x1="1080" y1="525" x2="1080" y2="690" class="grid"/>
  <line x1="1195" y1="525" x2="1195" y2="690" class="grid"/>
  <text x="1045" y="715" class="t xs">−η</text><text x="1175" y="715" class="t xs">+η</text>
  <text x="955" y="552" class="t xs">η &gt; 0: priority effects / alternative stable states</text>
  <text x="955" y="582" class="t xs">η &lt; 0: rare-form advantage / coexistence</text>
  <path d="M980 650 L1230 540" class="arrow"/>

  <!-- connecting message -->
  <path d="M785 325 C835 325, 825 245, 855 245" class="arrow"/>
  <path d="M785 335 C835 335, 825 585, 855 585" class="arrow"/>
  <text x="825" y="420" class="t xs" transform="rotate(90 825 420)">new biology enters after profitability</text>

  <!-- Environmental turnover of the limiting persistence barrier -->
  <rect x="60" y="800" width="1270" height="250" class="box"/>
  <text x="85" y="840" class="t m">D. The reason for persistence can change before the phenotype does</text>
  <text x="85" y="872" class="t xs">Let environment E lower architecture cost: k(E)=k0−c(E−E0), c&gt;0, with strict convex recovery.</text>
  <text x="85" y="898" class="t xs">Ecological stabilization exists if ΔR(E_A)&lt;0; canonically, η &gt; B_A = Φ(E_A).</text>

  <line x1="150" y1="950" x2="1240" y2="950" class="axis"/>
  <line x1="420" y1="922" x2="420" y2="978" class="grid"/>
  <line x1="700" y1="922" x2="700" y2="978" class="grid"/>
  <line x1="980" y1="922" x2="980" y2="978" class="grid"/>

  <text x="392" y="1000" class="t xs">E_V</text>
  <text x="673" y="1000" class="t xs">E_A</text>
  <text x="953" y="1000" class="t xs">E_I</text>

  <text x="235" y="928" text-anchor="middle" class="t xs">adaptive integration</text>
  <text x="560" y="928" text-anchor="middle" class="t xs">historical trapping</text>
  <text x="840" y="928" text-anchor="middle" class="t xs">ecological stabilization</text>
  <text x="1110" y="928" text-anchor="middle" class="t xs">division of labor can establish</text>

  <text x="235" y="1030" text-anchor="middle" class="t xs">Φ&lt;0</text>
  <text x="560" y="1030" text-anchor="middle" class="t xs">Φ&gt;0, g₀&lt;0</text>
  <text x="840" y="1030" text-anchor="middle" class="t xs">Φ&gt;0, g₀&gt;0, ΔR&lt;0</text>
  <text x="1110" y="1030" text-anchor="middle" class="t xs">Φ&gt;0, g₀&gt;0, ΔR&gt;0</text>

  <text x="60" y="1082" class="t xs">If ΔR(E_A) ≥ 0, rare establishment is already possible when the local barrier disappears.</text>
  <text x="60" y="1108" class="t xs">Main message: ecology determines whether a distinct ecologically stabilized integrated phase exists.</text>
</svg>